name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npm run format:check

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npm run lint:eslint

  oxlint:
    name: Oxlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npm run lint:oxlint

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npm run lint:css

  duplicates:
    name: Duplicate detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JSCPD_CACHE_DIR: ${{ github.workspace }}/.quality-results/jscpd-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .quality-results/jscpd-cache
          key: jscpd-5.4.1-CodeRankEmbed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/**/*.ts', 'tests/**/*.ts', '*.config.ts', 'lint/**/*.ts') }}
          restore-keys: |
            jscpd-5.4.1-CodeRankEmbed-${{ runner.os }}-${{ runner.arch }}-
      - run: npm run lint:duplicates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duplicate-reports
          path: .quality-results/jscpd/*.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npm run build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npm test

  browser-tests:
    name: Browser tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global pnpm@10.33.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
