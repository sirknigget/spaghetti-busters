name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            command: npm run format:check
          - name: ESLint
            command: npm run lint:eslint
          - name: Oxlint
            command: npm run lint:oxlint
          - name: Stylelint
            command: npm run lint:css
          - name: Build
            command: npm run build
          - name: Unit tests
            command: npm test
          - name: Duplicate detection
            command: npm run lint:duplicates
          - name: Unused code
            command: npm run lint:unused
          - name: Production unused code
            command: npm run lint:unused:production
          - name: Architecture metrics
            command: npm run lint:architecture
          - name: Dependency graph
            command: npm run lint:dependencies
    env:
      JSCPD_CACHE_DIR: ${{ github.workspace }}/.quality-results/jscpd-cache
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        if: matrix.name == 'Duplicate detection'
        with:
          path: .quality-results/jscpd-cache
          key: jscpd-5.4.1-CodeRankEmbed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/**/*.ts', 'tests/**/*.ts', '*.config.ts', 'lint/**/*.ts') }}
          restore-keys: |
            jscpd-5.4.1-CodeRankEmbed-${{ runner.os }}-${{ runner.arch }}-
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.name == 'Duplicate detection' }}
        with:
          name: duplicate-reports
          path: .quality-results/jscpd/*.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    needs: [checks, browser-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name. See docs/vercel-deployment.md."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Vercel CLI
        run: npm install --global vercel@64.3.1
      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production
      - name: Build for production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod
      - name: Deploy production build
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"

  browser-tests:
    name: Browser tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
